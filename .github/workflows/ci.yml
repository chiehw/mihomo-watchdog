name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Test
        run: make test
      - name: Smoke
        run: ./mihomo-watchdog -h
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-watchdog-linux-amd64
          path: mihomo-watchdog
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mihomo-watchdog
          generate_release_notes: true
